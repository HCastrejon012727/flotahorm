// MSAL instance (singleton)
let _msalApp=null;
let _spSiteId=null;
let _listIds={}; // listName -> listId

function getMsal(){
  if(!_msalApp){
    _msalApp=new msal.PublicClientApplication({
      auth:{clientId:SP_CONFIG.clientId,authority:`https://login.microsoftonline.com/${SP_CONFIG.tenantId}`,redirectUri:window.location.href.split("?")[0].split("#")[0]},
      cache:{cacheLocation:"sessionStorage",storeAuthStateInCookie:false},
    });
  }
  return _msalApp;
}

async function getToken(){
  const app=getMsal();
  await app.initialize();
  const scopes=["https://graph.microsoft.com/Sites.ReadWrite.All","https://graph.microsoft.com/Lists.ReadWrite.All"];
  const accounts=app.getAllAccounts();
  if(accounts.length>0){
    try{
      const r=await app.acquireTokenSilent({scopes,account:accounts[0]});
      return r.accessToken;
    }catch{}
  }
  const r=await app.acquireTokenPopup({scopes});
  return r.accessToken;
}

async function graphFetch(path,opts={}){
  const token=await getToken();
  const res=await fetch(`https://graph.microsoft.com/v1.0${path}`,{
    ...opts,
    headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json",...(opts.headers||{})},
    body:opts.body?JSON.stringify(opts.body):undefined,
  });
  if(!res.ok){const t=await res.text();throw new Error(`Graph ${res.status}: ${t}`);}
  if(res.status===204)return null;
  return res.json();
}

// Obtener siteId de SharePoint
async function getSiteId(){
  if(_spSiteId)return _spSiteId;
  const host="hormigonescastrejon.sharepoint.com";
  const sitePath="/sites/Flotadevehculos";
  const data=await graphFetch(`/sites/${host}:${sitePath}`);
  _spSiteId=data.id;
  return _spSiteId;
}

// Obtener o crear lista por nombre
async function getListId(listName){
  if(_listIds[listName])return _listIds[listName];
  const siteId=await getSiteId();
  // Buscar lista existente
  try{
    const data=await graphFetch(`/sites/${siteId}/lists?$filter=displayName eq '${listName}'&$select=id,displayName`);
    if(data.value&&data.value.length>0){
      _listIds[listName]=data.value[0].id;
      return _listIds[listName];
    }
  }catch{}
  // Crear lista nueva con campo "payload" (JSON comprimido) + campo "itemId" (título)
  const created=await graphFetch(`/sites/${siteId}/lists`,{
    method:"POST",
    body:{displayName:listName,list:{template:"genericList"},columns:[
      {name:"itemId",text:{},indexed:true},
      {name:"payload",text:{allowMultipleLines:true,maxLength:0}},
    ]},
  });
  _listIds[listName]=created.id;
  return _listIds[listName];
}

// Leer todos los items de una lista → array de objetos JS
async function spLoad(listName){
  try{
    const siteId=await getSiteId();
    const listId=await getListId(listName);
    let items=[],url=`/sites/${siteId}/lists/${listId}/items?$expand=fields($select=itemId,payload)&$top=500`;
    while(url){
      const data=await graphFetch(url);
      items=[...items,...(data.value||[])];
      url=data["@odata.nextLink"]?data["@odata.nextLink"].replace("https://graph.microsoft.com/v1.0",""):null;
    }
    return items.map(i=>{try{return JSON.parse(i.fields.payload);}catch{return null;}}).filter(Boolean);
  }catch(e){console.warn(`spLoad ${listName}:`,e);return[];}
}

// Guardar array completo: upsert por itemId usando el campo "id" del objeto
async function spSave(listName,items){
  try{
    const siteId=await getSiteId();
    const listId=await getListId(listName);
    // Obtener items existentes para saber cuáles actualizar vs crear
    let existing=[],url=`/sites/${siteId}/lists/${listId}/items?$expand=fields($select=id,itemId)&$top=500`;
    while(url){
      const data=await graphFetch(url);
      existing=[...existing,...(data.value||[])];
      url=data["@odata.nextLink"]?data["@odata.nextLink"].replace("https://graph.microsoft.com/v1.0",""):null;
    }
    const existMap={};
    existing.forEach(e=>{if(e.fields?.itemId)existMap[e.fields.itemId]=e.id;});
    // Ids que ya no están → borrar
    const newIds=new Set(items.map(i=>i.id));
    const toDelete=existing.filter(e=>e.fields?.itemId&&!newIds.has(e.fields.itemId));
    // Lanzar todo en paralelo por lotes de 10
    const batch=async(arr,fn)=>{for(let i=0;i<arr.length;i+=10)await Promise.all(arr.slice(i,i+10).map(fn));};
    await batch(toDelete,e=>graphFetch(`/sites/${siteId}/lists/${listId}/items/${e.id}`,{method:"DELETE"}));
    await batch(items,item=>{
      const spId=existMap[item.id];
      const body={fields:{itemId:item.id,Title:item.id,payload:JSON.stringify(item)}};
      if(spId)return graphFetch(`/sites/${siteId}/lists/${listId}/items/${spId}`,{method:"PATCH",body});
      return graphFetch(`/sites/${siteId}/lists/${listId}/items`,{method:"POST",body});
    });
  }catch(e){console.warn(`spSave ${listName}:`,e);}
}

      conductorHabitual:"",mecanico:MECANICOS_INI[n%4].id,kmUltAceite:ult,

}

function Dashboard({vehiculos,intervenciones,sanciones,extintores,seguros,onSelectVeh}){
  const op=vehiculos.filter(v=>v.estado==="Operativo").length;
  const et=vehiculos.filter(v=>v.estado==="En taller").length;
  const itvA=vehiculos.filter(v=>{const d=diasHasta(v.itv);return d!==null&&d<60;});
  const segA=vehiculos.filter(v=>{const d=diasHasta(v.seguroVto);return d!==null&&d<60;});
  const tacoA=vehiculos.filter(v=>{const d=diasHasta(v.tacoFechaRenov);return v.tacoFechaRenov&&d!==null&&d<60;});
  const aceA=vehiculos.filter(v=>{const p=(+v.kmUltAceite)+(+v.intervaloAceite||20000);return(+v.km)>=(p-2000);});
  const otsA=intervenciones.filter(o=>o.estadoOT==="Abierta"||o.estadoOT==="En progreso");
  const otsPropias=otsA.filter(o=>!o.tallerExterno);
  const otsExternas=otsA.filter(o=>o.tallerExterno);
  const sanP=sanciones.filter(s=>s.estado==="Pendiente");
  const extC=extintores.filter(e=>e.estado==="Caducado"||(e.proximaRev&&diasHasta(e.proximaRev)<30));

  const alertasUrgentes=[
    ...otsA.filter(o=>o.nivel==="N1 – Crítica").map(o=>({tipo:"N1",vId:o.vehiculoId,txt:o.sintoma||o.tipo,c:"red",badge:"N1 CRÍTICA"})),
    ...itvA.map(v=>({tipo:"ITV",vId:v.id,txt:`Vence ${diasHasta(v.itv)<0?"hace "+Math.abs(diasHasta(v.itv))+"d":"en "+diasHasta(v.itv)+"d"}`,c:"orange",badge:"ITV"})),
    ...segA.map(v=>({tipo:"SEG",vId:v.id,txt:`Seguro vence ${diasHasta(v.seguroVto)<0?"hace "+Math.abs(diasHasta(v.seguroVto))+"d":"en "+diasHasta(v.seguroVto)+"d"}`,c:"orange",badge:"SEGURO"})),

/* ── Importar Km ── */
function ImportarKm({vehiculos,setVehiculos,onClose}){
  const [paso,setPaso]=useState("upload"); // upload | preview | done
  const [filas,setFilas]=useState([]);
  const [errores,setErrores]=useState([]);
  const [actualizados,setActualizados]=useState([]);
  const [fechaLect,setFechaLect]=useState(hoy());

  const leerArchivo=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const ext=file.name.split(".").pop().toLowerCase();
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        let rows=[];
        if(ext==="csv"||ext==="txt"){
          const txt=ev.target.result;
          const lines=txt.split(/\r?\n/).filter(l=>l.trim());
          if(lines.length<2){setErrores(["El archivo CSV está vacío o no tiene filas de datos."]);return;}
          // Detectar separador: ; o ,
          const sep=lines[0].includes(";")?";":","
          const heads=lines[0].split(sep).map(h=>h.trim().toLowerCase().replace(/"/g,""));
          // Buscar columnas por nombre flexible
          const iMat=heads.findIndex(h=>h.includes("matric")||h==="matricula"||h==="mat");
          const iKm=heads.findIndex(h=>h.includes("km")||h.includes("kil")||h==="odometro");
          const iFecha=heads.findIndex(h=>h.includes("fecha")||h==="date");
          if(iMat<0||iKm<0){setErrores([`No se encontraron columnas de matrícula y km. Cabeceras detectadas: ${heads.join(", ")}`]);return;}
          rows=lines.slice(1).map(l=>{
            const cols=l.split(sep).map(c=>c.trim().replace(/"/g,""));
            return{matricula:(cols[iMat]||"").toUpperCase(),km:parseInt((cols[iKm]||"").replace(/\./g,"").replace(",","")),fecha:iFecha>=0?cols[iFecha]:fechaLect};
          }).filter(r=>r.matricula&&!isNaN(r.km));
        } else {
          // Excel
          const wb=XLSX.read(ev.target.result,{type:"binary"});
          const ws=wb.Sheets[wb.SheetNames[0]];
          const data=XLSX.utils.sheet_to_json(ws,{defval:""});
          if(!data.length){setErrores(["La hoja Excel no contiene datos."]);return;}
          const heads=Object.keys(data[0]).map(k=>k.toLowerCase());
          const kMat=Object.keys(data[0]).find(k=>k.toLowerCase().includes("matric")||k.toLowerCase()==="matricula"||k.toLowerCase()==="mat");
          const kKm=Object.keys(data[0]).find(k=>k.toLowerCase().includes("km")||k.toLowerCase().includes("kil")||k.toLowerCase()==="odometro");
          const kFecha=Object.keys(data[0]).find(k=>k.toLowerCase().includes("fecha")||k.toLowerCase()==="date");
          if(!kMat||!kKm){setErrores([`Columnas no encontradas. Cabeceras Excel: ${Object.keys(data[0]).join(", ")}\n\nNecesito columnas con 'matricula' y 'km'.`]);return;}
          rows=data.map(r=>({
            matricula:String(r[kMat]||"").toUpperCase().trim(),
            km:parseInt(String(r[kKm]||"0").replace(/\./g,"").replace(",","")),
            fecha:kFecha&&r[kFecha]?String(r[kFecha]).slice(0,10):fechaLect
          })).filter(r=>r.matricula&&!isNaN(r.km)&&r.km>0);
        }
        if(!rows.length){setErrores(["No se encontraron filas válidas con matrícula y km."]);return;}
        // Cruzar con vehículos
        const resultado=rows.map(r=>{
          const v=vehiculos.find(x=>x.matricula.toUpperCase().replace(/[\s-]/g,"")===r.matricula.replace(/[\s-]/g,""));
          return{...r,vehiculoId:v?.id,codigo:v?.codigo,kmAnterior:v?.km,ok:!!v,diff:v?r.km-v.km:null};
        });
        setFilas(resultado);
        setErrores([]);
        setPaso("preview");
      }catch(err){setErrores(["Error leyendo el archivo: "+err.message]);}
    };
    if(ext==="csv"||ext==="txt")reader.readAsText(file,"UTF-8");
    else reader.readAsBinaryString(file);
  };

  const aplicar=()=>{
    const validos=filas.filter(f=>f.ok&&f.km>0);
    setVehiculos(prev=>prev.map(v=>{
      const r=validos.find(f=>f.vehiculoId===v.id);
      if(!r)return v;
      return{...v,km:r.km,histKm:[...(v.histKm||[]),{fecha:r.fecha,km:r.km,anterior:v.km}]};
    }));
    setActualizados(validos);
    setPaso("done");
  };

  const validos=filas.filter(f=>f.ok);
  const noEncontrados=filas.filter(f=>!f.ok);

  return h(Modal,{title:"📥 Importar km semanales",onClose,wide:true},
    paso==="upload"&&h("div",null,
      h("div",{style:{background:C.bluB,border:`1px solid ${C.bluD}`,borderRadius:8,padding:14,marginBottom:14,fontSize:12,color:C.blu}},
        h("div",{style:{fontWeight:700,marginBottom:6}},"📋 Formato esperado del archivo"),
        h("div",null,"El archivo Excel (.xlsx) o CSV debe tener al menos estas columnas (el nombre puede variar):"),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginTop:8}},
          h("div",{style:{background:C.card,border:`1px solid ${C.bdr}`,borderRadius:6,padding:"6px 10px",fontWeight:700,fontSize:12,textAlign:"center"}},"matricula"),
          h("div",{style:{background:C.card,border:`1px solid ${C.bdr}`,borderRadius:6,padding:"6px 10px",fontWeight:700,fontSize:12,textAlign:"center"}},"km"),
          h("div",{style:{background:C.card,border:`1px solid ${C.bdr}`,borderRadius:6,padding:"6px 10px",fontSize:12,textAlign:"center",color:C.txtS}},"fecha (opcional)")
        ),
        h("div",{style:{marginTop:8,color:C.txtS,fontSize:11}},"Si no incluyes columna de fecha, se usará la fecha que indiques abajo.")
      ),
      h("div",{style:{marginBottom:12}},
        h("label",{style:{fontSize:12,fontWeight:600,display:"block",marginBottom:4}},"Fecha de la lectura (si no viene en el archivo)"),
        h("input",{type:"date",value:fechaLect,onChange:e=>setFechaLect(e.target.value),style:{padding:"6px 10px",borderRadius:7,border:`1px solid ${C.bdr}`,fontSize:13}})
      ),
      h("label",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,padding:28,border:`2px dashed ${C.bdr}`,borderRadius:10,cursor:"pointer",background:C.gryB,textAlign:"center"}},
        h("span",{style:{fontSize:32}},"📂"),
        h("span",{style:{fontWeight:600,fontSize:13}},"Seleccionar archivo Excel o CSV"),
        h("span",{style:{fontSize:11,color:C.txtS}},"Formatos soportados: .xlsx, .xls, .csv"),
        h("input",{type:"file",accept:".xlsx,.xls,.csv,.txt",onChange:leerArchivo,style:{display:"none"}})
      ),
      errores.length>0&&h("div",{style:{marginTop:10,background:C.redB,border:`1px solid ${C.redD}`,borderRadius:7,padding:10,fontSize:12,color:C.red}},
        errores.map((e,i)=>h("div",{key:i},e))
      ),
      h("div",{style:{display:"flex",justifyContent:"flex-end",marginTop:14}},
        h(Btn,{variant:"ghost",onClick:onClose},"Cancelar")
      )
    ),

    paso==="preview"&&h("div",null,
      h("div",{style:{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}},
        h("div",{style:{background:C.grnB,border:`1px solid ${C.grnD}`,borderRadius:7,padding:"8px 14px",fontSize:13}},
          h("span",{style:{fontWeight:700,color:C.grn}},validos.length)," vehículos encontrados ✔"
        ),
        noEncontrados.length>0&&h("div",{style:{background:C.oraB,border:`1px solid ${C.oraD}`,borderRadius:7,padding:"8px 14px",fontSize:13}},
          h("span",{style:{fontWeight:700,color:C.ora}},noEncontrados.length)," matrículas no encontradas ⚠"
        )
      ),
      h("div",{style:{maxHeight:340,overflowY:"auto",border:`1px solid ${C.bdr}`,borderRadius:8}},
        h("table",{style:{width:"100%",fontSize:12}},
          h("thead",null,h("tr",{style:{background:C.nav,position:"sticky",top:0}},
            ["Matrícula","Código","Fecha","Km anterior","Km nuevo","Diferencia",""].map(t=>h("th",{key:t,style:{padding:"7px 10px",color:"#fff",textAlign:"left",fontWeight:500,fontSize:11}},t))
          )),
          h("tbody",null,filas.map((f,i)=>h("tr",{key:i,style:{background:f.ok?i%2?C.gryB:C.card:C.redB}},
            h("td",{style:{padding:"6px 10px",fontWeight:600}},f.matricula),
            h("td",{style:{padding:"6px 10px",color:C.acc,fontWeight:700}},f.codigo||"—"),
            h("td",{style:{padding:"6px 10px",color:C.txtS}},f.fecha),
            h("td",{style:{padding:"6px 10px",textAlign:"right"}},f.kmAnterior!=null?f.kmAnterior.toLocaleString():"—"),
            h("td",{style:{padding:"6px 10px",textAlign:"right",fontWeight:600}},f.km.toLocaleString()),
            h("td",{style:{padding:"6px 10px",textAlign:"right",color:f.diff>0?C.grn:f.diff<0?C.red:C.txtM}},
              f.diff!=null?(f.diff>0?"+":"")+f.diff.toLocaleString()+" km":"—"
            ),
            h("td",{style:{padding:"6px 10px"}},f.ok
              ?h("span",{style:{color:C.grn,fontSize:11,fontWeight:600}},"✔ OK")
              :h("span",{style:{color:C.red,fontSize:11,fontWeight:600}},"⚠ No encontrada"))
          )))
        )
      ),
      noEncontrados.length>0&&h("div",{style:{marginTop:8,fontSize:11,color:C.ora}},
        "Matrículas no encontradas: ",noEncontrados.map(f=>f.matricula).join(", ")
      ),
      h("div",{style:{display:"flex",gap:8,justifyContent:"space-between",marginTop:14}},
        h(Btn,{variant:"ghost",onClick:()=>setPaso("upload")},"← Volver"),
        h(Btn,{onClick:aplicar,disabled:validos.length===0},`Actualizar ${validos.length} vehículos`)
      )
    ),

    paso==="done"&&h("div",{style:{textAlign:"center",padding:"24px 0"}},
      h("div",{style:{fontSize:40,marginBottom:12}},"✅"),
      h("div",{style:{fontSize:16,fontWeight:700,color:C.grn,marginBottom:6}},`${actualizados.length} vehículos actualizados`),
      h("div",{style:{fontSize:12,color:C.txtS,marginBottom:16}},"Los km han quedado registrados con fecha "+fechaLect),
      h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center",maxWidth:500,margin:"0 auto"}},
        actualizados.map(a=>h("span",{key:a.vehiculoId,style:{background:C.grnB,border:`1px solid ${C.grnD}`,color:C.grn,borderRadius:99,padding:"3px 10px",fontSize:11,fontWeight:600}},a.codigo))
      ),
      h("div",{style:{marginTop:20}},h(Btn,{onClick:onClose},"Cerrar"))
    )
  );
}

/* ── Tabla Vehículos ── */
function ModVehiculos({vehiculos,setVehiculos,onSelect,intervenciones,aceite,neumaticos,sanciones,seguros}){
  const [filtroE,setFiltroE]=useState("Todos");
  const [filtroA,setFiltroA]=useState("Todos");
  const [q,setQ]=useState("");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [showImport,setShowImport]=useState(false);
  const ff=k=>v=>setForm(p=>({...p,[k]:v}));

  const lista=useMemo(()=>vehiculos.filter(v=>{
    if(filtroE!=="Todos"&&v.estado!==filtroE)return false;
    if(q&&!`${v.codigo} ${v.matricula} ${v.marca} ${v.modelo}`.toLowerCase().includes(q.toLowerCase()))return false;
    if(filtroA==="ITV"){const d=diasHasta(v.itv);return d!==null&&d<60;}
    if(filtroA==="Aceite")return v.km>=(v.kmUltAceite+v.intervaloAceite)-1000;
    if(filtroA==="Seguro"){const d=diasHasta(v.seguroVto);return d!==null&&d<60;}
    if(filtroA==="Tacógrafo")return v.tacoFechaRenov&&diasHasta(v.tacoFechaRenov)<60;
    return true;
  }),[vehiculos,filtroE,q,filtroA]);

  const abrirEditar=v=>{setForm({...v});setModal("edit");};
  const abrirNuevo=()=>{setForm({id:uid(),codigo:`H-${String(vehiculos.length+1).padStart(2,"0")}`,matricula:"",marca:"",modelo:"",anio:2022,bastidor:"",km:0,estado:"Operativo",itv:"",seguroVto:"",seguroCompania:"",seguroPoliza:"",seguroTipo:"Todo riesgo",tacoMarca:"",tacoModelo:"",tacoCodigo:"",tacoFechaRenov:"",intervaloAceite:20000,tipoAceite:"15W-40",litrosAceite:22,filtrosNota:"",conductorHabitual:"",mecanico:"",kmUltAceite:0,proveedor:"",fechaCompra:"",precio:0,obs:""});setModal("new");};
  const guardar=()=>{setVehiculos(p=>modal==="new"?[...p,form]:p.map(v=>v.id===form.id?form:v));setModal(null);};
  const eliminar=id=>{if(confirm("¿Eliminar este vehículo?"))setVehiculos(p=>p.filter(v=>v.id!==id));setModal(null);};

  return h("div",null,
    h("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:12,flexWrap:"wrap",justifyContent:"space-between"}},
      h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}},
        h("input",{placeholder:"Buscar...",value:q,onChange:e=>setQ(e.target.value),style:{padding:"6px 12px",borderRadius:7,border:`1px solid ${C.bdr}`,fontSize:13,width:180}}),
        ["Todos",...ESTADOS_VEH].map(e=>h("button",{key:e,onClick:()=>setFiltroE(e),style:{padding:"5px 10px",borderRadius:7,fontSize:11,fontWeight:500,cursor:"pointer",border:`1px solid ${filtroE===e?C.acc:C.bdr}`,background:filtroE===e?C.acc:"transparent",color:filtroE===e?"#fff":C.txtS}},e)),
        h("button",{onClick:()=>setFiltroA(filtroA==="ITV"?"Todos":"ITV"),style:{padding:"5px 10px",borderRadius:7,fontSize:11,cursor:"pointer",border:`1px solid ${filtroA==="ITV"?C.ora:C.bdr}`,background:filtroA==="ITV"?C.oraB:"transparent",color:filtroA==="ITV"?C.ora:C.txtS}},"⚠ ITV"),
        h("button",{onClick:()=>setFiltroA(filtroA==="Seguro"?"Todos":"Seguro"),style:{padding:"5px 10px",borderRadius:7,fontSize:11,cursor:"pointer",border:`1px solid ${filtroA==="Seguro"?C.blu:C.bdr}`,background:filtroA==="Seguro"?C.bluB:"transparent",color:filtroA==="Seguro"?C.blu:C.txtS}},"🛡 Seguro"),
        h("button",{onClick:()=>setFiltroA(filtroA==="Tacógrafo"?"Todos":"Tacógrafo"),style:{padding:"5px 10px",borderRadius:7,fontSize:11,cursor:"pointer",border:`1px solid ${filtroA==="Tacógrafo"?C.pur:C.bdr}`,background:filtroA==="Tacógrafo"?C.purB:"transparent",color:filtroA==="Tacógrafo"?C.pur:C.txtS}},"📟 Tacógrafo"),
      ),
      h("div",{style:{display:"flex",gap:6}},
        h(Btn,{onClick:()=>setShowImport(true),sm:true,variant:"ghost"},"📥 Importar km"),
        h(Btn,{onClick:abrirNuevo,sm:true},"+ Nuevo vehículo")
      )
    ),
    showImport&&h(ImportarKm,{vehiculos,setVehiculos,onClose:()=>setShowImport(false)}),
    h("div",{style:{overflowX:"auto"}},
      h("table",{style:{width:"100%",fontSize:12}},
        h("thead",null,h("tr",{style:{background:C.nav}},
          ["Código","Matrícula","Marca / Modelo","Año","Km","Estado","ITV","Aceite","Seguro","Tacógrafo","Coste total",""].map(th=>h("th",{key:th,style:{padding:"8px 10px",textAlign:"left",color:C.navText,fontWeight:500,fontSize:11,whiteSpace:"nowrap"}},th))
        )),
        h("tbody",null,lista.map((v,i)=>{
          const itv=alertaITV(v.itv),ac=alertaAce(v.km,v.kmUltAceite,v.intervaloAceite);
          const seg=alertaSeguro(v.seguroVto),taco=alertaTaco(v.tacoFechaRenov);
          const ec=EC[v.estado]||EC["Operativo"];
          const myOTs=(intervenciones||[]).filter(x=>x.vehiculoId===v.id);
          const myAce=(aceite||[]).filter(x=>x.vehiculoId===v.id);
          const myNeu=(neumaticos||[]).filter(x=>x.vehiculoId===v.id);
          const mySan=(sanciones||[]).filter(x=>x.vehiculoId===v.id);
          const mySeg=(seguros||[]).filter(x=>x.vehiculoId===v.id&&!x.esSiniestro);
          const costeTotal=myOTs.reduce((s,o)=>s+(+o.costeOT||0)+(+o.costeRec||0),0)+myAce.reduce((s,a)=>s+(+a.coste||0),0)+myNeu.reduce((s,n)=>s+(+n.coste||0),0)+mySeg.reduce((s,p)=>s+(+p.prima||0),0)+mySan.reduce((s,sa)=>s+(+sa.importe||0),0);

      h(Inp,{label:"Observaciones",value:form.obs,onChange:ff("obs"),rows:2}),

/* ── Exportar Word ── */
async function exportarInformeWord(v,{myOTs,myAce,myNeu,mySan,myExt,mySeg,siniestros,polizas}){
  // Asegurar que la librería docx está disponible
  if(typeof docx==="undefined"){
    await new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js";
      s.onload=res;s.onerror=rej;document.head.appendChild(s);
    });
  }
  const {Document,Packer,Paragraph,Table,TableRow,TableCell,TextRun,HeadingLevel,WidthType,AlignmentType,BorderStyle,ShadingType}=docx;
  const fmtDate=s=>s?new Date(s).toLocaleDateString("es-ES"):"—";
  const fmtNum=n=>n!=null&&n!==""?Number(n).toLocaleString("es-ES"):"—";
  const fmtEur=n=>n!=null&&n!==""?Number(n).toLocaleString("es-ES",{minimumFractionDigits:2})+" €":"—";

  const hdr=(txt,lvl=HeadingLevel.HEADING_1)=>new Paragraph({text:txt,heading:lvl,spacing:{before:240,after:120}});
  const sep=()=>new Paragraph({text:"",spacing:{before:60,after:60}});
  const pr=(label,val)=>new Paragraph({children:[new TextRun({text:label+": ",bold:true,size:20}),new TextRun({text:String(val||"—"),size:20})],spacing:{before:40,after:40}});

  const tblBorder={style:BorderStyle.SINGLE,size:4,color:"CCCCCC"};
  const cellBorders={top:tblBorder,bottom:tblBorder,left:tblBorder,right:tblBorder};

  const mkCell=(txt,isHead=false)=>new TableCell({
    children:[new Paragraph({children:[new TextRun({text:String(txt||"—"),bold:isHead,size:isHead?18:18,color:isHead?"FFFFFF":"333333"})],alignment:AlignmentType.LEFT,spacing:{before:40,after:40}})],
    borders:cellBorders,
    shading:isHead?{type:ShadingType.SOLID,color:"0D2B5A",fill:"0D2B5A"}:{type:ShadingType.CLEAR,color:"auto",fill:"auto"},
    margins:{top:60,bottom:60,left:100,right:100}
  });

  const mkTable=(headers,rows)=>{
    if(!rows.length)return new Paragraph({children:[new TextRun({text:"Sin registros",italics:true,color:"999999",size:20})],spacing:{before:40,after:80}});
    const colW=Math.floor(9000/headers.length);
    return new Table({
      width:{size:100,type:WidthType.PERCENTAGE},
      rows:[
        new TableRow({children:headers.map(h=>mkCell(h,true)),tableHeader:true}),
        ...rows.map(r=>new TableRow({children:r.map(c=>mkCell(c))}))
      ],
      margins:{top:0,bottom:0,left:0,right:0}
    });
  };

  const costeOTs=myOTs.reduce((s,o)=>s+(+o.costeOT||0)+(+o.costeRec||0),0);
  const costeAce=myAce.reduce((s,a)=>s+(+a.coste||0),0);
  const costeNeu=myNeu.reduce((s,n)=>s+(+n.coste||0),0);
  const costeSeg=polizas.reduce((s,p)=>s+(+p.prima||0),0);
  const costeSan=mySan.reduce((s,s2)=>s+(+s2.importe||0),0);
  const costeTotal=costeOTs+costeAce+costeNeu+costeSeg+costeSan;

  const children=[
    // PORTADA
    new Paragraph({children:[new TextRun({text:"INFORME DE VEHÍCULO",bold:true,size:48,color:"0D2B5A"})],alignment:AlignmentType.CENTER,spacing:{before:400,after:120}}),
    new Paragraph({children:[new TextRun({text:`${v.codigo} — ${v.matricula}`,bold:true,size:36,color:"1B5CB5"})],alignment:AlignmentType.CENTER,spacing:{before:0,after:80}}),
    new Paragraph({children:[new TextRun({text:`${v.marca} ${v.modelo} · Año ${v.anio}`,size:24,color:"666666"})],alignment:AlignmentType.CENTER,spacing:{before:0,after:80}}),
    new Paragraph({children:[new TextRun({text:`Generado el ${new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"long",year:"numeric"})}`,size:20,color:"999999"})],alignment:AlignmentType.CENTER,spacing:{before:0,after:400}}),

    // 1. DATOS GENERALES
    hdr("1. Datos generales",HeadingLevel.HEADING_1),
    mkTable(["Campo","Valor"],[
      ["Código interno",v.codigo],["Matrícula",v.matricula],["Marca",v.marca],["Modelo",v.modelo],
      ["Año fabricación",v.anio],["Bastidor (VIN)",v.bastidor||"—"],["Estado",v.estado],
      ["Km actuales",fmtNum(v.km)+" km"],["Conductor habitual",v.conductorHabitual||"—"],
      ["Proveedor / Dealer",v.proveedor||"—"],["Fecha compra",fmtDate(v.fechaCompra)],
      ["Precio compra",fmtEur(v.precio)],["Observaciones",v.obs||"—"],
    ]),
    sep(),

    // 2. ACEITE Y FILTROS
    hdr("2. Aceite y filtros",HeadingLevel.HEADING_1),
    mkTable(["Campo","Valor"],[
      ["Tipo aceite",v.tipoAceite],["Litros",v.litrosAceite+" L"],["Intervalo",fmtNum(v.intervaloAceite)+" km"],
      ["Km último cambio",fmtNum(v.kmUltAceite)+" km"],["Tipos de filtros",v.filtrosNota||"—"],
    ]),
    sep(),

    // 3. ITV
    hdr("3. ITV",HeadingLevel.HEADING_1),
    mkTable(["Campo","Valor"],[
      ["Próxima ITV",fmtDate(v.itv)],
    ]),
    sep(),

    // 4. SEGURO (datos del vehículo)
    hdr("4. Seguro",HeadingLevel.HEADING_1),
    mkTable(["Campo","Valor"],[
      ["Vencimiento",fmtDate(v.seguroVto)],["Compañía",v.seguroCompania||"—"],
      ["Nº póliza",v.seguroPoliza||"—"],["Tipo",v.seguroTipo||"—"],
    ]),
    sep(),

    // 5. TACÓGRAFO
    hdr("5. Tacógrafo",HeadingLevel.HEADING_1),
    mkTable(["Campo","Valor"],[
      ["Marca",v.tacoMarca||"—"],["Modelo",v.tacoModelo||"—"],
      ["Código / Nº serie",v.tacoCodigo||"—"],["Fecha renovación",fmtDate(v.tacoFechaRenov)],
    ]),
    sep(),

    // 6. RESUMEN COSTES
    hdr("6. Resumen de costes",HeadingLevel.HEADING_1),
    mkTable(["Concepto","Importe"],[
      ["Órdenes de trabajo (mano de obra + recambios)",fmtEur(costeOTs)],
      ["Cambios de aceite",fmtEur(costeAce)],
      ["Neumáticos",fmtEur(costeNeu)],
      ["Primas de seguro",fmtEur(costeSeg)],
      ["Sanciones",fmtEur(costeSan)],
      ["TOTAL",fmtEur(costeTotal)],
    ]),
    sep(),

    // 7. ÓRDENES DE TRABAJO
    hdr("7. Órdenes de trabajo ("+myOTs.length+")",HeadingLevel.HEADING_1),
    mkTable(
      ["Fecha","Tipo","Estado","Nivel","Síntoma / Trabajos","Km","Coste OT","Coste rec.","Proveedor"],
      myOTs.map(o=>[fmtDate(o.fecha),o.tipo,o.estadoOT,o.nivel||"—",o.sintoma||(o.trabajos||"—"),fmtNum(o.km)+" km",fmtEur(o.costeOT),fmtEur(o.costeRec),o.tallerExterno?(o.proveedorTaller||"Externo"):"Taller propio"])
    ),
    sep(),

    // 8. CAMBIOS DE ACEITE
    hdr("8. Cambios de aceite ("+myAce.length+")",HeadingLevel.HEADING_1),
    mkTable(
      ["Fecha","Km","Marca aceite","Viscosidad","Litros","Filtros cambiados","Coste"],
      myAce.map(a=>[fmtDate(a.fecha),fmtNum(a.km)+" km",a.marcaAceite||"—",a.visc||"—",a.litros+" L",[a.fAceite?"Aceite":null,a.fAire?"Aire":null,a.fGasoil?"Gasoil":null,a.fAdblue?"AdBlue":null].filter(Boolean).join(", ")||"Solo aceite",fmtEur(a.coste)])
    ),
    sep(),

    // 9. NEUMÁTICOS
    hdr("9. Neumáticos ("+myNeu.length+")",HeadingLevel.HEADING_1),
    mkTable(
      ["Fecha","Posición","Marca","Medida","Motivo","Prof. salida","Prof. nuevo","Presión","Coste"],
      myNeu.map(n=>[fmtDate(n.fecha),n.posicion||"—",n.marca||"—",n.medida||"—",n.motivo||"—",(n.profSal||"—")+" mm",(n.profNvo||"—")+" mm",(n.presion||"—")+" bar",fmtEur(n.coste)])
    ),
    sep(),

    // 10. SANCIONES
    hdr("10. Sanciones ("+mySan.length+")",HeadingLevel.HEADING_1),
    mkTable(
      ["Fecha","Tipo infracción","Gravedad","Conductor","Organismo","Importe","Puntos","Estado"],
      mySan.map(s=>[fmtDate(s.fechaInf),s.tipo||"—",s.gravedad||"—",s.conductor||"—",s.organismo||"—",fmtEur(s.importe),s.puntos||"0",s.estado])
    ),
    sep(),

    // 11. EXTINTORES Y ELEMENTOS DE SEGURIDAD
    hdr("11. Extintores y elementos de seguridad ("+myExt.length+")",HeadingLevel.HEADING_1),
    mkTable(
      ["Tipo","Posición","Estado","Agente","Capacidad","Fabricación","Última rev.","Próxima rev.","Precinto"],
      myExt.map(e=>[e.tipoElem,e.posicion||"—",e.estado,e.tipoAgente||"—",(e.capacidad||"—")+" kg",fmtDate(e.fabricacion),fmtDate(e.ultimaRev),fmtDate(e.proximaRev),e.precinto?"Sí":"No"])
    ),
    sep(),

    // 12. PÓLIZAS DE SEGURO
    hdr("12. Pólizas de seguro ("+polizas.length+")",HeadingLevel.HEADING_1),
    mkTable(
      ["Fecha alta","Vencimiento","Compañía","Nº póliza","Tipo","Prima anual","Observaciones"],
      polizas.map(p=>[fmtDate(p.fecha),fmtDate(p.vencimiento),p.compania||"—",p.poliza||"—",p.tipo||"—",fmtEur(p.prima),p.obs||"—"])
    ),
    sep(),

    // 13. SINIESTROS
    hdr("13. Siniestros declarados ("+siniestros.length+")",HeadingLevel.HEADING_1),
    mkTable(
      ["Fecha","Tipo","Conductor","Responsabilidad","Estado expediente","Importe rep.","Descripción"],
      siniestros.map(s=>[fmtDate(s.fecha),s.tipo||"—",s.conductor||"—",s.culpa||"—",s.estado||"—",fmtEur(s.importeRep),s.descripcion||"—"])
    ),
    sep(),

    // 14. HISTORIAL KM
    ...(v.histKm&&v.histKm.length>0?[
      hdr("14. Historial de km importados ("+v.histKm.length+")",HeadingLevel.HEADING_1),
      mkTable(
        ["Fecha","Km registrados","Km anteriores","Diferencia"],
        [...v.histKm].reverse().map(r=>[fmtDate(r.fecha),fmtNum(r.km)+" km",fmtNum(r.anterior)+" km","+"+(r.km-r.anterior).toLocaleString("es-ES")+" km"])
      ),
      sep(),
    ]:[]),

    // PIE
    new Paragraph({children:[new TextRun({text:`Documento generado automáticamente por FlotaHorm. · ${new Date().toLocaleString("es-ES")}`,size:16,color:"AAAAAA",italics:true})],alignment:AlignmentType.CENTER,spacing:{before:400}}),
  ];

  const doc=new Document({sections:[{properties:{},children}]});
  const fname=`Informe_${v.codigo}_${v.matricula.replace(/[^A-Z0-9]/g,"")}_${hoy()}.docx`;

  // 1) Intentar API nativa de descargas del artifact viewer
  try{
    const dl=window.claude&&await window.claude.use("downloads");
    if(dl){
      const blob=await Packer.toBlob(doc);
      const ab=await blob.arrayBuffer();
      await dl.save(fname,new Uint8Array(ab),"application/vnd.openxmlformats-officedocument.wordprocessingml.document");
      return;
    }
  }catch(e){console.warn("downloads API error:",e);}

  // 2) Fallback: convertir a base64 y abrir nueva ventana con enlace de descarga
  try{
    const b64=await Packer.toBase64String(doc);
    const dataUrl="data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64,"+b64;
    const win=window.open("","_blank");
    if(win){
      win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Descarga</title></head><body style="font-family:sans-serif;padding:40px;text-align:center"><h2>📄 ${fname}</h2><p style="margin:20px 0">Haz clic en el botón para descargar el informe Word</p><a href="${dataUrl}" download="${fname}" style="display:inline-block;background:#E87722;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:600;font-size:16px">⬇ Descargar ${fname}</a></body></html>`);
      win.document.close();
      return;
    }
  }catch(e){console.warn("base64 fallback error:",e);}

  // 3) Último recurso: blob URL directo
  try{
    const blob=await Packer.toBlob(doc);
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=fname;document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){alert("No se pudo generar el informe. Error: "+e.message);}
}

function FichaVehiculo({v,vFull,mecanicos,intervenciones,aceite,neumaticos,sanciones,extintores,seguros,setSeguros,onBack,setVehiculos,setIntervenciones,setAceite,setNeumaticos,setSanciones,setExtintores}){

  const mySeg=seguros.filter(x=>x.vehiculoId===v.id).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));

  const mec=mecanicos.find(m=>m.id===v.mecanico);
  const itv=alertaITV(v.itv);

  const seg=alertaSeguro(v.seguroVto);

  const ec=EC[v.estado]||EC["Operativo"];

  // Coste total vehículo
  const costeOTs=myOTs.reduce((s,o)=>s+(+o.costeOT||0)+(+o.costeRec||0),0);
  const costeAce=myAce.reduce((s,a)=>s+(+a.coste||0),0);
  const costeNeu=myNeu.reduce((s,n)=>s+(+n.coste||0),0);
  const costeSeg=mySeg.reduce((s,sg)=>s+(+sg.prima||0),0);
  const costeSan=mySan.reduce((s,sa)=>s+(+sa.importe||0),0);
  const costeTotal=costeOTs+costeAce+costeNeu+costeSeg+costeSan;

  const defOT={tipo:"Reparación taller propio",estadoOT:"Abierta",fecha:hoy(),km:v.km,nivel:"",sintoma:"",diagnostico:"",trabajos:"",recambios:"",horas:"",costeOT:"",costeRec:"",tallerExterno:false,proveedorTaller:"",obs:""};

  const [loading,setLoading]=useState(true);
  const [dbReady,setDbReady]=useState(false);
  const [loginError,setLoginError]=useState(null);
  const [vehiculos,setVehiculos]=useState([]);
  const [mecanicos]=useState(MECANICOS_INI);
  const [intervenciones,setIntervenciones]=useState([]);
  const [aceite,setAceite]=useState([]);
  const [neumaticos,setNeumaticos]=useState([]);
  const [sanciones,setSanciones]=useState([]);
  const [extintores,setExtintores]=useState([]);
  const [seguros,setSeguros]=useState([]);
  const [nav,setNav]=useState("dashboard");
  const [vSel,setVSel]=useState(null);
  const [saving,setSaving]=useState(false);
  const [userEmail,setUserEmail]=useState("");

  useEffect(()=>{
    (async()=>{
      try{
        // Inicializar MSAL y manejar redirect
        const app=getMsal();
        await app.initialize();
        await app.handleRedirectPromise();
        // Cargar datos de SharePoint
        const [vv,oo,aa,nn,ss,ee,sg]=await Promise.all([
          spLoad("vehiculos"),spLoad("intervenciones"),spLoad("aceite"),
          spLoad("neumaticos"),spLoad("sanciones"),spLoad("extintores"),spLoad("seguros"),
        ]);
        setVehiculos(vv);
        setIntervenciones(oo);setAceite(aa);setNeumaticos(nn);setSanciones(ss);setExtintores(ee);setSeguros(sg);
        // Email del usuario autenticado
        const accounts=app.getAllAccounts();
        if(accounts.length>0)setUserEmail(accounts[0].username);
        setDbReady(true);
      }catch(e){
        console.error("Error cargando SharePoint:",e);
        setLoginError(e.message||"Error de autenticación");
      }
      setLoading(false);
    })();
  },[]);

  const saveToDb=useCallback(async(col,items)=>{
    if(!dbReady)return;
    setSaving(true);
    try{await spSave(col,items);}
    catch(e){console.warn("Error guardando en SharePoint:",e);}
    setSaving(false);
  },[dbReady]);

  const wrap=(setter,col)=>updater=>{setter(prev=>{const next=typeof updater==="function"?updater(prev):updater;saveToDb(col,next);return next;});};
  const setV=useCallback(wrap(setVehiculos,"vehiculos"),[saveToDb]);
  const setI=useCallback(wrap(setIntervenciones,"intervenciones"),[saveToDb]);
  const setA=useCallback(wrap(setAceite,"aceite"),[saveToDb]);
  const setN=useCallback(wrap(setNeumaticos,"neumaticos"),[saveToDb]);
  const setS=useCallback(wrap(setSanciones,"sanciones"),[saveToDb]);
  const setE=useCallback(wrap(setExtintores,"extintores"),[saveToDb]);
  const setSg=useCallback(wrap(setSeguros,"seguros"),[saveToDb]);

  const selVeh=v=>{setVSel(vehiculos.find(x=>x.id===v.id)||v);setNav("ficha");};
  const navItems=[{id:"dashboard",label:"Dashboard"},{id:"flota",label:`Flota (${vehiculos.length})`}];


  if(loading)return h("div",{style:{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}},h(Loader));

  if(loginError)return h("div",{style:{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,padding:24}},
    h("div",{style:{fontSize:40}},"🔐"),
    h("div",{style:{fontSize:18,fontWeight:700,color:C.txt}},"Iniciar sesión en Microsoft 365"),
    h("div",{style:{fontSize:13,color:C.txtS,maxWidth:400,textAlign:"center"}},loginError.includes("popup")||loginError.includes("interaction")?"Haz clic en el botón para autenticarte con tu cuenta de empresa.":"Error: "+loginError),
    h("button",{onClick:async()=>{setLoginError(null);setLoading(true);try{await getToken();window.location.reload();}catch(e){setLoginError(e.message);setLoading(false);}},style:{background:C.acc,color:"#fff",border:"none",borderRadius:8,padding:"10px 24px",fontSize:14,fontWeight:600,cursor:"pointer"}},"Iniciar sesión con Microsoft")
  );

  return h("div",{style:{minHeight:"100vh",background:C.bg}},
    h("div",{style:{background:C.nav,color:"#fff",padding:"0 20px",display:"flex",alignItems:"center",position:"sticky",top:0,zIndex:100}},
      h("div",{style:{padding:"12px 0",marginRight:28}},
        h("div",{style:{fontSize:15,fontWeight:800,letterSpacing:-.5}},"🚛 FlotaHorm."),
        h("div",{style:{fontSize:10,opacity:.45,marginTop:-1}},vehiculos.length+" vehículos")
      ),
      navItems.map(n=>h("button",{key:n.id,onClick:()=>{setNav(n.id);setVSel(null);},style:{background:"none",border:"none",color:nav===n.id?"#fff":C.navSub,padding:"16px 12px",cursor:"pointer",fontSize:12,fontWeight:nav===n.id?700:400,borderBottom:nav===n.id?"2px solid #fff":"2px solid transparent",fontFamily:"inherit"}},n.label)),
      h("div",{style:{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}},
        saving&&h("span",{style:{fontSize:11,opacity:.7,color:"#fff"}},"💾 Guardando en SharePoint..."),
        dbReady&&h("span",{style:{fontSize:11,color:C.navSub,background:"rgba(255,255,255,.1)",padding:"2px 8px",borderRadius:99}},`✔ SharePoint · ${userEmail||""}`),
        h("span",{style:{fontSize:11,opacity:.4,color:"#fff"}},new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"short"}))
      )
    ),
    h("div",{style:{maxWidth:1180,margin:"0 auto",padding:"18px 14px"}},
      nav==="dashboard"&&h(Dashboard,{vehiculos,intervenciones,aceite:aceite,neumaticos,sanciones,extintores,seguros,onSelectVeh:selVeh}),
      nav==="flota"&&!vSel&&h(ModVehiculos,{vehiculos,setVehiculos:setV,onSelect:selVeh,intervenciones,aceite,neumaticos,sanciones,seguros}),
      (nav==="ficha"||nav==="flota")&&vSel&&h(FichaVehiculo,{
        v:vSel,mecanicos,intervenciones,aceite,neumaticos,sanciones,extintores,seguros,setSeguros:setSg,
        onBack:()=>{setNav("flota");setVSel(null);},
        setVehiculos:setV,setIntervenciones:setI,setAceite:setA,setNeumaticos:setN,setSanciones:setS,setExtintores:setE
      }),
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
